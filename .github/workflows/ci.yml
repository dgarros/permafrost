name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Lint and types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install Python
        run: uv python install
      - name: Install dependencies
        run: uv sync --locked --group dev
      - name: Lint
        run: uv run --locked ruff check
      - name: Check formatting
        run: uv run --locked ruff format --check
      - name: Check types
        run: uv run --locked ty check

  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    env:
      # Takes precedence over `.python-version` for every `uv` command in this job.
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-suffix: py${{ matrix.python-version }}
      - name: Install Python
        run: uv python install
      - name: Install dependencies
        run: uv sync --locked --group dev
      - name: Run unit tests
        run: uv run --locked pytest tests/unit
      - name: Run Redis integration tests
        run: uv run --locked pytest tests/integration
