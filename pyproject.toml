[project]
name = "permafrost"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Damien Garros", email = "dgarros@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "msgpack>=1.2.3",
    "pydantic>=2.12.4",
]

[project.optional-dependencies]
redis = [
    "redis>=5",
]

[build-system]
requires = ["uv_build>=0.8.15,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "fakeredis>=2.40.0",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.2",
    "testcontainers[redis]>=4.15.0",
    "ty>=0.0.91",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["redis: integration tests using a Testcontainers-managed Redis server (requires Docker)"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# ANN401 reports `Any` as a whole annotation; TID251 reports every import of `Any`, including nested uses.
extend-select = ["ANN401", "TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"typing.Any" = { msg = "Declare an exact type, or `object` where the type is open." }

[tool.ty.environment]
python-version = "3.12"

[tool.ty.rules]
unused-ignore-comment = "error"
